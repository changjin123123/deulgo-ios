name: iPhone build and tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'changjin123123/deulgo-ios' && github.ref == 'refs/heads/main'
    environment: ios-release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain
        run: |
          xcodebuild -version
          python3 scripts/check_structure.py
          node --test scripts/test_rules.cjs
      - name: Choose iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path(os.environ['RUNNER_TEMP'], 'simulators.json').read_text())['devices']
          iphones = [d for key, group in devices.items() if 'iOS' in key for d in group if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not iphones: raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('SIMULATOR_ID=' + iphones[0]['udid'] + '\n')
          PY
      - name: Run XCTest
        run: xcodebuild -quiet test -project Deulgo.xcodeproj -scheme Deulgo -destination "platform=iOS Simulator,arch=arm64,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export test summary
        run: |
          xcrun xcresulttool get test-results summary --path build/Tests.xcresult > build/test-summary.json
          cat build/test-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('build/test-summary.json').read_text())
          if summary.get('passedTests', 0) < 28 or summary.get('failedTests', 0) != 0:
              raise SystemExit('Expected at least 28 passing XCTest cases and no failures')
          PY
      - name: Launch app and capture iPhone screen
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/simulator/Build/Products/Debug-iphonesimulator/Deulgo.app
          xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" com.deulgo.delivery
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot build/Deulgo-iPhone.png
      - name: Configure approved native key
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          key = os.environ.get('KAKAO_KEY', '')
          if not re.fullmatch(r'[0-9a-fA-F]{32}', key):
              raise SystemExit('Missing or invalid approved native app key')
          path = Path('Config/Local.xcconfig')
          path.write_text('KAKAO_NATIVE_APP_KEY = ' + key + '\n')
          path.chmod(0o600)
          PY
      - name: Build unsigned iPhone application
        run: |
          xcodebuild -quiet build -project Deulgo.xcodeproj -scheme Deulgo -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Deulgo.app build/package/Payload/
          python3 - <<'PY'
          import plistlib, re
          from pathlib import Path
          settings = Path('Config/Local.xcconfig').read_text()
          key = settings.partition('=')[2].strip()
          info = plistlib.loads(Path('build/package/Payload/Deulgo.app/Info.plist').read_bytes())
          if not re.fullmatch(r'[0-9a-fA-F]{32}', key) or info.get('KakaoNativeAppKey') != key:
              raise SystemExit('Packaged native key validation failed')
          if info.get('CFBundleIdentifier') != 'com.deulgo.delivery':
              raise SystemExit('Packaged bundle identifier mismatch')
          print('PASS: approved native key and bundle identifier packaged; key value withheld')
          PY
          cd build/package
          zip -qr ../Deulgo-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Deulgo-iPhone-unsigned
          path: build/Deulgo-unsigned.ipa
          retention-days: 7
      - name: Remove temporary native key settings
        if: always()
        run: rm -f Config/Local.xcconfig
      - uses: actions/upload-artifact@v4
        with:
          name: Deulgo-iPhone-screen
          path: build/Deulgo-iPhone.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Deulgo-test-results
          path: |
            build/Tests.xcresult
            build/test-summary.json
          retention-days: 7
