name: iPhone build and tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure optional native key
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          key = os.environ.get('KAKAO_KEY', '')
          if key and not re.fullmatch(r'[0-9a-fA-F]{32}', key):
              raise SystemExit('Invalid native app key format')
          Path('Config/Local.xcconfig').write_text('KAKAO_NATIVE_APP_KEY = ' + key + '\n')
          PY
      - name: Check toolchain
        run: |
          xcodebuild -version
          python3 scripts/check_structure.py
          node --test scripts/test_rules.cjs
      - name: Choose iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path(os.environ['RUNNER_TEMP'], 'simulators.json').read_text())['devices']
          iphones = [d for key, group in devices.items() if 'iOS' in key for d in group if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not iphones: raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('SIMULATOR_ID=' + iphones[0]['udid'] + '\n')
          PY
      - name: Run XCTest
        run: xcodebuild -quiet test -project Deulgo.xcodeproj -scheme Deulgo -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Launch app and capture iPhone screen
        run: |
          xcrun simctl install "$SIMULATOR_ID" build/simulator/Build/Products/Debug-iphonesimulator/Deulgo.app
          xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" com.deulgo.delivery
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot build/Deulgo-iPhone.png
      - name: Build unsigned iPhone application
        run: |
          xcodebuild -quiet build -project Deulgo.xcodeproj -scheme Deulgo -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Deulgo.app build/package/Payload/
          cd build/package
          zip -qr ../Deulgo-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Deulgo-iPhone-unsigned
          path: build/Deulgo-unsigned.ipa
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Deulgo-iPhone-screen
          path: build/Deulgo-iPhone.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Deulgo-test-results
          path: build/Tests.xcresult
          retention-days: 7
